<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>總務報修系統｜門市端</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#EEF2F6;
    --grid:rgba(27,42,65,.05);
    --surface:#FFFFFF;
    --ink:#1B2A41;
    --ink-soft:#5C6B7C;
    --border:#D2DCE6;
    --primary:#2C6E8E;      /* 鋼藍：主要動作 */
    --primary-ink:#FFFFFF;
    --urgent:#D93B30;       /* 安全警示紅：緊急 */
    --warn:#E2941A;         /* 安全警示黃：影響營運/待處理 */
    --normal:#5C7A99;       /* 灰藍：一般 */
    --ok:#2C6E8E;
    --chip-bg:#E4EAF0;
    --radius:10px;
    --shadow: 0 1px 2px rgba(27,42,65,.06), 0 6px 18px rgba(27,42,65,.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; color:var(--ink);
    font-family:"Noto Sans TC","Space Grotesk",sans-serif;
    -webkit-tap-highlight-color:transparent;
    background-color:var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  h1,h2,h3,.display{ font-family:"Space Grotesk","Noto Sans TC",sans-serif; letter-spacing:-.01em; }
  .mono{ font-family:"JetBrains Mono",monospace; }
  #app{ max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- 頂部 ---------- */
  header.topbar{
    position:sticky; top:0; z-index:10;
    background:var(--bg); padding:18px 20px 10px;
    display:flex; align-items:center; gap:10px;
    border-bottom:1px solid transparent;
  }
  header.topbar .back{ font-size:20px; cursor:pointer; padding:4px 8px; margin-left:-8px; border-radius:6px; }
  header.topbar .back:active{ background:var(--chip-bg); }
  header.topbar h1{ font-size:17px; font-weight:700; margin:0; flex:1; letter-spacing:.02em; }

  main{ flex:1; padding:6px 20px 100px; }

  /* ---------- 通用元件 ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:18px; margin-bottom:14px;
    box-shadow:var(--shadow);
  }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:15px 18px; border-radius:8px; border:none;
    font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;
    letter-spacing:.02em;
  }
  .btn-primary{ background:var(--primary); color:var(--primary-ink); }
  .btn-primary:active{ opacity:.85; }
  .btn-outline{ background:var(--surface); color:var(--ink); border:1.5px solid var(--border); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); font-weight:500; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  label.field-label{ display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin:16px 0 6px; text-transform:uppercase; letter-spacing:.05em; }
  label.field-label:first-child{ margin-top:0; }
  input[type=text], input[type=email], input[type=password], input[type=date], select, textarea{
    width:100%; padding:13px 14px; border-radius:8px; border:1.5px solid var(--border);
    font-size:15px; font-family:inherit; color:var(--ink); background:var(--surface);
  }
  textarea{ min-height:90px; resize:vertical; }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--primary); outline-offset:1px; }

  .chip-group{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    padding:9px 15px; border-radius:6px; border:1.5px solid var(--border);
    background:var(--surface); font-size:13px; font-weight:700; cursor:pointer; color:var(--ink-soft);
  }
  .chip[data-selected="true"]{ border-color:transparent; color:#fff; }
  .chip[data-selected="true"]:not([data-level]){ background:var(--primary); }
  .chip[data-level="normal"][data-selected="true"]{ background:var(--normal); }
  .chip[data-level="operational"][data-selected="true"]{ background:var(--warn); }
  .chip[data-level="urgent"][data-selected="true"]{ background:var(--urgent); }

  /* ---------- 首頁 ---------- */
  .hero{ text-align:center; padding:24px 8px 10px; }
  .hero .mark{ font-size:36px; }
  .hero h1{ font-size:20px; margin:10px 0 2px; }
  .hero p{ color:var(--ink-soft); font-size:13px; margin:0; font-family:"JetBrains Mono",monospace; }
  .cta-grid{ display:flex; flex-direction:column; gap:12px; margin-top:20px; }
  .cta{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow); cursor:pointer;
    border-left:4px solid var(--primary);
  }
  .cta .ico{ font-size:24px; width:40px; text-align:center; }
  .cta .txt strong{ display:block; font-size:15px; }
  .cta .txt span{ font-size:12px; color:var(--ink-soft); }
  .cta:active{ transform:scale(.98); }

  /* ---------- 進度指示（新增報修） ---------- */
  .steps{ display:flex; gap:6px; margin:2px 0 18px; }
  .steps i{ flex:1; height:4px; border-radius:2px; background:var(--border); }
  .steps i.done{ background:var(--primary); }

  /* ---------- 案件工單樣式（signature element：藍圖角括號） ---------- */
  .ticket{
    background:var(--surface); border-radius:6px;
    box-shadow:var(--shadow); margin-bottom:12px; position:relative; border:1px solid var(--border);
  }
  .ticket-body{ padding:16px 18px 14px; position:relative; }
  .ticket-body::before, .ticket-body::after{
    content:""; position:absolute; width:10px; height:10px; border:2px solid var(--border);
  }
  .ticket-body::before{ top:6px; left:6px; border-right:none; border-bottom:none; }
  .ticket-body::after{ bottom:6px; right:6px; border-left:none; border-top:none; }
  .ticket[data-urgency="urgent"] .ticket-body::before, .ticket[data-urgency="urgent"] .ticket-body::after{ border-color:var(--urgent); }
  .ticket[data-urgency="operational"] .ticket-body::before, .ticket[data-urgency="operational"] .ticket-body::after{ border-color:var(--warn); }
  .ticket[data-urgency="normal"] .ticket-body::before, .ticket[data-urgency="normal"] .ticket-body::after{ border-color:var(--normal); }
  .ticket-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:0 6px; }
  .ticket-no{ font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--ink-soft); letter-spacing:.5px; }
  .ticket-title{ font-size:15px; font-weight:700; margin:4px 0 2px; }
  .ticket-sub{ font-size:12px; color:var(--ink-soft); }
  .status-pill{
    font-size:11px; font-weight:700; padding:5px 10px; border-radius:6px;
    background:var(--chip-bg); color:var(--ink-soft); white-space:nowrap;
    font-family:"JetBrains Mono",monospace;
  }
  .status-pill[data-active="true"]{ background:#E3EEF3; color:var(--primary); }
  .repeat-flag{
    margin:10px 6px 0; font-size:11px; font-weight:700; color:var(--urgent);
    background:#FBE7E5; display:inline-block; padding:5px 10px; border-radius:6px;
    font-family:"JetBrains Mono",monospace;
  }

  /* ---------- 照片上傳格 ---------- */
  .upload-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:6px; }
  .upload-slot{
    aspect-ratio:1; border-radius:6px; border:1.5px dashed var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
    font-size:22px; background:#F7FAFC; cursor:pointer; overflow:hidden;
  }
  .upload-slot img{ width:100%; height:100%; object-fit:cover; }

  /* ---------- 底部固定按鈕列 ---------- */
  .footer-actions{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    background:linear-gradient(to top, var(--bg) 65%, transparent);
    padding:18px 20px 22px;
  }
  .footer-actions .inner{ max-width:480px; margin:0 auto; }

  .empty{ text-align:center; padding:50px 10px; color:var(--ink-soft); }
  .empty .mark{ font-size:32px; display:block; margin-bottom:10px; }

  .banner{
    background:#FBE7E5; color:var(--urgent); border-radius:8px; padding:12px 14px;
    font-size:13px; font-weight:700; margin-bottom:14px;
  }
  .success-wrap{ text-align:center; padding:50px 10px 10px; }
  .success-wrap .mark{ font-size:48px; }
  .success-wrap h2{ margin:10px 0 4px; }
  .success-wrap .no{ font-family:"JetBrains Mono",monospace; color:var(--ink-soft); font-size:14px; }

  .hidden{ display:none !important; }
  .filter-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; }
  .filter-row .chip{ white-space:nowrap; }

  /* ---------- 登入頁 ---------- */
  .login-wrap{ min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:30px 24px; }
  .login-mark{ text-align:center; font-size:38px; margin-bottom:6px; }
  .login-title{ text-align:center; font-size:18px; font-weight:700; margin:0 0 6px; }
  .login-tag{ text-align:center; font-size:11px; color:var(--ink-soft); font-family:"JetBrains Mono",monospace; margin:0 0 28px; letter-spacing:.08em; text-transform:uppercase; }
  .error-msg{
    background:#FBE7E5; color:var(--urgent); font-size:13px; font-weight:600;
    padding:10px 14px; border-radius:6px; margin-top:10px;
  }
  .login-switch{ text-align:center; margin-top:18px; font-size:13px; color:var(--ink-soft); }
  .login-switch a{ color:var(--primary); font-weight:700; text-decoration:none; cursor:pointer; }
  .logout-link{ font-size:12px; color:var(--ink-soft); cursor:pointer; text-decoration:underline; font-family:"JetBrains Mono",monospace; }
  .top-right{ margin-left:auto; }
  .version-badge{
    position:fixed; bottom:8px; right:10px; z-index:9999; pointer-events:none;
    font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.03em;
    color:var(--ink-soft); background:var(--surface); border:1px solid var(--border);
    padding:2px 7px; border-radius:5px; opacity:.75;
  }  .attach-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(100px,1fr)); gap:10px; margin-top:8px; }
  .attach-item{ border:1px solid var(--border); border-radius:8px; overflow:hidden; background:#F7FAFC; }
  .attach-item img{ width:100%; height:80px; object-fit:cover; display:block; }
  .attach-upload-btn{
    display:flex; align-items:center; justify-content:center; min-height:80px;
    border:1.5px dashed var(--border); border-radius:8px; color:var(--ink-soft); font-size:13px; cursor:pointer;
  }
</style>
</head>
<body>
<div id="app">
  <div style="padding:60px 24px; text-align:center; color:#7A6F63; font-family:sans-serif; font-size:14px;">
    載入中…如果這段文字一直沒有消失，代表網頁程式無法執行，請截圖回報。
  </div>
</div>
<div class="version-badge">store v2026-09-03.6</div>

<script>
/* ============================================================
   Supabase 設定 — 請把下面兩個值換成你自己的 Supabase 專案設定
   （Supabase 後台 → Settings → API）
   ============================================================ */
const SUPABASE_URL = "https://qvhwwrmduqdjgnuszqvs.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_No3AgE0uvJ_S6OSP3bUePA_zLIIIEXW";

window.addEventListener("error", function(e){
  document.getElementById("app").innerHTML = `
    <main style="padding:40px 24px;">
      <div class="card">
        <h2>⚠️ 網頁執行時發生錯誤</h2>
        <p style="color:var(--ink-soft); font-size:13px; line-height:1.7;">${e.message}</p>
        <p style="color:var(--ink-soft); font-size:12px; margin-top:8px;">位置：${e.filename}:${e.lineno}</p>
      </div>
    </main>`;
});
window.addEventListener("unhandledrejection", function(e){
  document.getElementById("app").innerHTML = `
    <main style="padding:40px 24px;">
      <div class="card">
        <h2>⚠️ 連線時發生未預期的錯誤</h2>
        <p style="color:var(--ink-soft); font-size:13px; line-height:1.7;">${e.reason?.message || e.reason}</p>
      </div>
    </main>`;
});

let sb = null;
let initError = "";
try{
  if(!window.supabase){
    throw new Error("Supabase JS 函式庫未載入成功（window.supabase 不存在），可能是 CDN 連線被擋，或網路異常。");
  }
  if(SUPABASE_URL.startsWith("http")){
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
}catch(e){
  initError = e.message || String(e);
}

/* ============================================================
   簡易狀態與畫面路由（單頁應用，比照既有訂購系統的做法）
   ============================================================ */
const URGENCY_LABEL = { normal:"一般", operational:"影響營運", urgent:"緊急" };
const STATUS_LABEL = {
  new:"新案件", pending_review:"待總務確認", pending_info:"資料待補",
  initial_troubleshoot:"初步排除中", contacting_vendor:"聯絡廠商中", pending_quote:"等待報價",
  pending_approval:"等待核准", scheduled:"已安排維修", pending_parts:"等待零件",
  in_repair:"維修中", pending_store_confirm:"待您確認", repair_done:"維修完成",
  closed:"已結案", cancelled:"已取消"
};
const ACTIVE_STATUSES = ["pending_info","pending_store_confirm"]; // 需要門市動作的狀態

let state = {
  view: "login",          // login | signup | home | new-report | my-cases | case-detail
  session: null,
  profile: null,
  storeId: null,
  storeName: "",
  loginError: "",
  signupError: "",
  stores: [],             // 供申請帳號時選擇門市
  generalCategories: [],  // 一般報修類別（從資料庫載入）
  newReport: { step:1, repairType:null, assetId:null, assetLabel:"", generalCategory:null,
               selectedStoreId: null,
               reportDate: new Date().toISOString().slice(0,10),
               faultCategory:"", faultReason:"", suspectedCause:"", faultDescription:"",
               reporterName:"", reporterPhone:"", urgency:null, photos:[] },
  cases: [],
  currentCase: null,
  caseUploadMarks: {},
  setup: {
    view: "menu",
    regions: [], assetMajorCategories: [], assetMinorCategories: [], allStores: [],
    newStore: { code:"", name:"", regionId:"" }, storeFormError:"", lastCreatedStoreId:"",
    newAsset: { storeId:"", assetNo:"", name:"", majorCode:"", minorCode:"", brand:"", model:"", serialNo:"", source:"" },
    assetFormError:"", assetSessionCount:0, sessionAssets:[],
    newInfra: { storeId:"", itemType:"", description:"", relatedArea:"", photoFiles:[], photoPreviews:[], latitude:null, longitude:null, compassHeading:null },
    infraFormError:"", infraSessionCount:0,
    photoStoreId:"", photoAssetResults:[], photoSelectedAsset:null, photoAssetAttachments:[], photoNoPhotoOnly:false,
  },
};

const app = document.getElementById("app");

function render(){
  if(!sb){
    app.innerHTML = configWarning();
    return;
  }
  if(state.view === "login") app.innerHTML = renderLogin();
  else if(state.view === "signup") app.innerHTML = renderSignup();
  else if(state.view === "profile-missing") app.innerHTML = renderProfileMissing();
  else if(state.view === "home") app.innerHTML = renderHome();
  else if(state.view === "new-report") app.innerHTML = renderNewReport();
  else if(state.view === "new-report-success") app.innerHTML = renderSuccess();
  else if(state.view === "my-cases") app.innerHTML = renderMyCases();
  else if(state.view === "case-detail") app.innerHTML = renderCaseDetail();
  else if(state.view === "setup-menu") app.innerHTML = renderSetupMenu();
  else if(state.view === "setup-new-store") app.innerHTML = renderSetupNewStore();
  else if(state.view === "setup-new-asset") app.innerHTML = renderSetupNewAsset();
  else if(state.view === "setup-new-infra") app.innerHTML = renderSetupNewInfra();
  else if(state.view === "setup-asset-photo") app.innerHTML = renderSetupAssetPhoto();
  bindEvents();
}

function configWarning(){
  return `
  <main style="padding:40px 24px;">
    <div class="card">
      <h2>⚙️ 尚未設定 Supabase 連線 / 載入發生問題</h2>
      <p style="color:var(--ink-soft); font-size:14px; line-height:1.7;">
        請打開 store.html 檔案，找到最上方的
        <code>SUPABASE_URL</code> 與 <code>SUPABASE_ANON_KEY</code>，
        換成你自己 Supabase 專案的設定值（在 Supabase 後台 Settings → API 可以找到），
        存檔後重新整理頁面即可。
      </p>
      ${initError ? `<div class="error-msg" style="margin-top:14px;">錯誤細節：${initError}</div>` : ""}
    </div>
  </main>`;
}

/* ---------------- 登入頁 ---------------- */
function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="login-mark">🔧</div>
    <h1 class="login-title">總務報修系統</h1>
    <p class="login-tag">Facility &amp; Repair Ops · 門市端</p>
    <label class="field-label">Email</label>
    <input type="email" id="login-email" placeholder="you@example.com">
    <label class="field-label">密碼</label>
    <input type="password" id="login-password" placeholder="請輸入密碼">
    ${state.loginError ? `<div class="error-msg">${state.loginError}</div>` : ""}
    <div style="margin-top:20px;">
      <button class="btn btn-primary" data-action="do-login">登入</button>
    </div>
    <div class="login-switch">還沒有帳號？<a data-action="go-signup">申請帳號</a></div>
  </div>`;
}

/* ---------------- 申請帳號 ---------------- */
function renderSignup(){
  const storeOptions = state.stores.map(s=>`<option value="${s.id}">${s.code ? '['+s.code+'] ' : ''}${s.name}</option>`).join("");
  return `
  <div class="login-wrap">
    <div class="login-mark">🧾</div>
    <h1 class="login-title">申請門市帳號</h1>
    <label class="field-label">姓名</label>
    <input type="text" id="signup-name" placeholder="您的姓名">
    <label class="field-label">Email</label>
    <input type="email" id="signup-email" placeholder="you@example.com">
    <label class="field-label">申請門市</label>
    <select id="signup-store"><option value="">請選擇門市…</option>${storeOptions}</select>
    <label class="field-label">密碼（至少6碼）</label>
    <input type="password" id="signup-password" placeholder="設定密碼">
    ${state.signupError ? `<div class="error-msg">${state.signupError}</div>` : ""}
    <p style="font-size:12px; color:var(--ink-soft); margin-top:14px; line-height:1.6;">
      送出後帳號將處於「待啟用」狀態，需由系統管理者確認門市與角色後才能登入使用。
    </p>
    <div style="margin-top:10px;">
      <button class="btn btn-primary" data-action="do-signup">送出申請</button>
    </div>
    <div class="login-switch"><a data-action="go-login">‹ 返回登入</a></div>
  </div>`;
}

/* ---------------- 帳號存在但尚未設定門市/角色 ---------------- */
function renderProfileMissing(){
  return `
  <div class="login-wrap">
    <div class="login-mark">⚙️</div>
    <h1 class="login-title">帳號待啟用</h1>
    <p style="text-align:center; color:var(--ink-soft); font-size:14px; line-height:1.7;">
      您的帳號已建立，但尚未由系統管理者指派門市與角色。<br>請聯繫總務協助開通後再登入。
    </p>
    <div style="margin-top:20px;">
      <button class="btn btn-outline" data-action="do-logout">登出</button>
    </div>
  </div>`;
}
function renderHome(){
  const notStoreAccount = state.profile && state.profile.role !== "store";
  const canSetup = state.profile && ["general_affairs","admin"].includes(state.profile.role);
  return `
  <header class="topbar"><h1>🔧 總務報修系統</h1><span class="top-right logout-link" data-action="do-logout">LOGOUT</span></header>
  <main>
    <div class="hero">
      <div class="mark">🛠️</div>
      <h1>${state.storeName || "門市"}</h1>
      <p>FACILITY REPORTING SYSTEM</p>
    </div>
    ${notStoreAccount ? `<div class="banner" style="background:var(--chip-bg); color:var(--ink-soft);">ℹ️ 此帳號角色為「${state.profile.role}」，未綁定固定門市，新增報修時可自行選擇代表門市。</div>` : ""}
    <div class="cta-grid">
      <div class="cta" data-action="go-new-report">
        <div class="ico">🧰</div>
        <div class="txt"><strong>新增報修</strong><span>設備故障、水電、環境問題</span></div>
      </div>
      <div class="cta" data-action="go-my-cases">
        <div class="ico">📁</div>
        <div class="txt"><strong>我的案件</strong><span>查看進度、補件、確認完修</span></div>
      </div>
      ${canSetup ? `
      <div class="cta" data-action="go-setup-menu" style="border-left:4px solid var(--warn);">
        <div class="ico">🏗️</div>
        <div class="txt"><strong>新門市建檔</strong><span>新增門市、資產、基礎設施照片</span></div>

/* ---------------- 新增報修（多步驟） ---------------- */
function renderNewReport(){
  const s = state.newReport;
  const stepDots = [1,2,3,4].map(n=>`<i class="${n<=s.step?'done':''}"></i>`).join("");

  let body = "";
  if(s.step === 1){
    const needsStorePicker = !state.storeId; // 總務/管理者等未綁定固定門市的帳號
    const storeOptions = state.stores.map(st=>`<option value="${st.id}" ${s.selectedStoreId===st.id?'selected':''}>${st.code ? '['+st.code+'] ' : ''}${st.name}</option>`).join("");
    const typeCardsDisabled = needsStorePicker && !s.selectedStoreId;
    body = `
      ${needsStorePicker ? `
        <label class="field-label">代表門市送出（此帳號未綁定固定門市）</label>
        <select id="report-store-picker">
          <option value="">請選擇門市…</option>
          ${storeOptions}
        </select>
      ` : ""}
      <h2 style="margin:16px 0 16px;">這是哪一種報修？</h2>
      <div class="card" data-action="pick-type" data-type="asset" style="cursor:pointer; ${typeCardsDisabled?'opacity:.4; pointer-events:none;':''}">
        <strong>🧊 連結既有資產</strong>
        <p style="color:var(--ink-soft); font-size:13px; margin:6px 0 0;">冰箱、製冰機、爐具等已登記的設備</p>
      </div>
      <div class="card" data-action="pick-type" data-type="general" style="cursor:pointer; ${typeCardsDisabled?'opacity:.4; pointer-events:none;':''}">
        <strong>🚿 一般報修（無資產）</strong>
        <p style="color:var(--ink-soft); font-size:13px; margin:6px 0 0;">水電、門鎖、牆面、招牌、排水等</p>
      </div>`;
  } else if(s.step === 2 && s.repairType === "asset"){
    body = `
      <h2 style="margin:4px 0 16px;">選擇資產</h2>
      <label class="field-label">搜尋資產編號或名稱</label>
      <input type="text" id="asset-search" placeholder="例如：製冰機 或 C002-17-001-0001">
      <div id="asset-results" style="margin-top:12px; color:var(--ink-soft); font-size:13px;">輸入關鍵字開始搜尋…</div>`;
  } else if(s.step === 2 && s.repairType === "general"){
    const cats = state.generalCategories.length ? state.generalCategories : ["水電","門鎖","牆面","招牌","排水","其他"];
    body = `
      <h2 style="margin:4px 0 16px;">選擇一般報修類別</h2>
      <div class="chip-group">
        ${cats.map(c=>`<span class="chip" data-action="pick-general" data-value="${c}" data-selected="${s.generalCategory===c}">${c}</span>`).join("")}
      </div>`;
  } else if(s.step === 3){
    body = `
      <h2 style="margin:4px 0 16px;">填寫故障資訊</h2>
      <label class="field-label">報告日期</label>
      <input type="date" id="report-date" value="${s.reportDate}">
      <label class="field-label">報修設備</label>
      <input type="text" id="fault-category" value="${s.faultCategory}" placeholder="例如：冷氣風管、製冰機">
      <label class="field-label">報修原因</label>
      <input type="text" id="fault-reason" value="${s.faultReason}" placeholder="例如：冷氣口沒風">
      <label class="field-label">推測原因（選填）</label>
      <input type="text" id="suspected-cause" value="${s.suspectedCause}" placeholder="例如：風管脫落固定不了">
      <label class="field-label">目前狀況</label>
      <textarea id="fault-desc" placeholder="請描述目前的狀況…">${s.faultDescription}</textarea>
      <label class="field-label">現場報修人</label>
      <input type="text" id="reporter-name" value="${s.reporterName}" placeholder="現場人員姓名">
      <label class="field-label">聯絡電話</label>
      <input type="text" id="reporter-phone" value="${s.reporterPhone}" placeholder="現場人員聯絡電話">
      <label class="field-label">緊急程度</label>
      <div class="chip-group">
        <span class="chip" data-level="normal" data-action="pick-urgency" data-value="normal" data-selected="${s.urgency==='normal'}">一般</span>
        <span class="chip" data-level="operational" data-action="pick-urgency" data-value="operational" data-selected="${s.urgency==='operational'}">影響營運</span>
        <span class="chip" data-level="urgent" data-action="pick-urgency" data-value="urgent" data-selected="${s.urgency==='urgent'}">緊急</span>
      </div>
      <p style="font-size:12px; color:var(--ink-soft); line-height:1.6; margin-top:10px;">
        一般：不影響營業　／　影響營運：還能勉強運作，已造成不便　／　緊急：完全無法使用，衝擊營業或食安安全
      </p>`;
  } else if(s.step === 4){
    body = `
      <h2 style="margin:4px 0 6px;">上傳照片／影片</h2>
      <p style="font-size:13px; color:var(--ink-soft); margin:0 0 4px;">影片限 30 秒內，最多 5 個檔案</p>
      <div class="upload-grid">
        ${[0,1,2,3,4].map(i=>{
          const f = s.photos[i];
          if(!f) return `<div class="upload-slot" data-action="upload-slot" data-index="${i}">＋</div>`;
          const inner = f.type.startsWith("video") ? "🎬" : `<img src="${f._previewUrl}">`;
          return `<div class="upload-slot" data-action="upload-slot" data-index="${i}">${inner}</div>`;
        }).join("")}
      </div>
      <div class="card" style="margin-top:20px;">
        <strong style="font-size:14px;">送出前確認</strong>
        <p style="font-size:13px; color:var(--ink-soft); margin:8px 0 2px;">所屬門市：${state.storeName || (state.stores.find(st=>st.id===s.selectedStoreId)||{}).name || '—'}</p>
        <p style="font-size:13px; color:var(--ink-soft); margin:2px 0;">類型：${s.repairType==='asset'?('資產：'+(s.assetLabel||'—')):('一般報修：'+(s.generalCategory||'—'))}</p>
        <p style="font-size:13px; color:var(--ink-soft); margin:2px 0;">報告日期：${s.reportDate||'—'}</p>
        <p style="font-size:13px; color:var(--ink-soft); margin:2px 0;">報修設備：${s.faultCategory||'—'}</p>
        <p style="font-size:13px; color:var(--ink-soft); margin:2px 0;">報修原因：${s.faultReason||'—'}</p>
        <p style="font-size:13px; color:var(--ink-soft); margin:2px 0;">現場報修人：${s.reporterName||'—'}（${s.reporterPhone||'—'}）</p>
        <p style="font-size:13px; color:var(--ink-soft); margin:2px 0;">緊急程度：${URGENCY_LABEL[s.urgency]||'—'}</p>
      </div>`;
  }

  // 代表門市持續提示：非固定門市帳號在步驟 1 之後，每一步都能看到目前選的是哪間門市，避免選錯後忘記
  const storeBanner = (!state.storeId && s.selectedStoreId)
    ? `<div class="banner" style="background:var(--chip-bg); color:var(--ink); font-weight:700;">🏬 代表門市：${(state.stores.find(st=>st.id===s.selectedStoreId)||{}).name || ''}</div>`
    : "";

  return `
  <header class="topbar">
    <span class="back" data-action="report-back">‹</span>
    <h1>新增報修</h1>
  </header>
  <main>
    <div class="steps">${stepDots}</div>
    ${s.step > 1 ? storeBanner : ""}
    ${body}
  </main>
  <div class="footer-actions"><div class="inner">
    ${s.step < 4
      ? `<button class="btn btn-primary" id="next-btn" data-action="report-next">下一步</button>`
      : `<button class="btn btn-primary" data-action="report-submit">送出報修</button>`}
  </div></div>`;
}

function renderMyCases(){
  const rows = state.cases;
  return `
  <header class="topbar">
    <span class="back" data-action="go-home">‹</span>
    <h1>我的案件</h1>

function ticketHtml(c){
  const needsAction = ACTIVE_STATUSES.includes(c.status);
  const subLine = [c.store_name, c.asset_name].filter(Boolean).join(" · ");
  return `
  <div class="ticket" data-urgency="${c.urgency}" data-action="open-case" data-id="${c.id}">
    <div class="ticket-body">
      <div class="ticket-top">
        <div>
          <div class="ticket-no">#${c.case_no}</div>
          <div class="ticket-title">${c.fault_category || c.general_category || '報修案件'}</div>
          <div class="ticket-sub">${subLine}</div>
        </div>
        <span class="status-pill" data-active="${needsAction}">${needsAction? '⚠️ ' : ''}${STATUS_LABEL[c.status]||c.status}</span>
      </div>
      ${c.repeat_fault ? `<div class="repeat-flag">⚠️ 重複故障／優先處理</div>` : ""}
    </div>
  </div>`;
}

        <p style="font-size:13px; color:var(--ink-soft);">請上傳維修後照片，並確認設備是否恢復正常。</p>

  <main>

/* ============================================================
   照片／影片上傳（Supabase Storage）
   ============================================================ */
const fileInput = document.createElement("input");
fileInput.type = "file";
fileInput.accept = "image/*,video/*";
fileInput.style.display = "none";
document.body.appendChild(fileInput);
let fileTarget = null; // { mode:'new-report'|'case-upload', index, caseId, category, markKey }

fileInput.addEventListener("change", async (e)=>{
  const files = Array.from(e.target.files || []);
  const target = fileTarget;
  fileInput.value = "";
  fileTarget = null;
  if(files.length === 0 || !target) return;

  // 門市基礎設施：支援一次選取多張照片
  if(target.mode === "infra-photo"){
    for(const f of files){
      if(f.size > 50 * 1024 * 1024){
        alert(`${f.name} 檔案過大（超過 50MB），已略過`);
        continue;
      }
      state.setup.newInfra.photoFiles.push(f);
      state.setup.newInfra.photoPreviews.push(URL.createObjectURL(f));
    }
    render();
    return;
  }

  // 資產補照片：支援一次選取多張照片，逐張直接上傳
  if(target.mode === "asset-photo-multi"){
    for(const f of files){
      if(f.size > 50 * 1024 * 1024){
        alert(`${f.name} 檔案過大（超過 50MB），已略過`);
        continue;
      }
      try{
        const ext = (f.name.split(".").pop() || "dat").toLowerCase();
        const path = `asset-photos/${target.assetId}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
        const { error: upErr } = await sb.storage.from("attachments").upload(path, f);
        if(upErr) throw upErr;
        const { data: urlData } = sb.storage.from("attachments").getPublicUrl(path);
        const { error: insErr } = await sb.from("attachments").insert({
          related_type: "asset", related_id: target.assetId, category: "asset_photo",
          file_path: urlData.publicUrl
        });
        if(insErr) throw insErr;
      }catch(err){
        alert(`${f.name} 上傳失敗：${err.message}`);
      }
    }
    await loadSetupAssetAttachments(target.assetId);
    return;
  }

  const file = files[0];
  if(file.size > 50 * 1024 * 1024){
    alert("檔案過大（超過 50MB），請重新拍攝或選擇較小的檔案");
    return;
  }

  try{
    if(file.type.startsWith("video")){
      await checkVideoDuration(file);
    }
  }catch(err){
    alert(err.message);
    return;
  }

  if(target.mode === "new-report"){
    if(file.type.startsWith("image")){
      file._previewUrl = URL.createObjectURL(file);
    }
    state.newReport.photos[target.index] = file;
    render();
  }else if(target.mode === "case-upload"){
    try{
      await uploadAttachment(target.caseId, file, target.category);
      state.caseUploadMarks[`${target.markKey}-${target.index}`] = true;
      render();
    }catch(err){
      alert("上傳失敗：" + err.message);
    }
  }else if(target.mode === "asset-photo"){
    try{
      const ext = (file.name.split(".").pop() || "dat").toLowerCase();
      const path = `asset-photos/${target.assetId}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
      const { error: upErr } = await sb.storage.from("attachments").upload(path, file);
      if(upErr) throw upErr;
      const { data: urlData } = sb.storage.from("attachments").getPublicUrl(path);
      const { error: insErr } = await sb.from("attachments").insert({
        related_type: "asset", related_id: target.assetId, category: "asset_photo",
        file_path: urlData.publicUrl
      });
      if(insErr) throw insErr;
      await loadSetupAssetAttachments(target.assetId);
    }catch(err){
      alert("上傳失敗：" + err.message);
    }
  }
});

function checkVideoDuration(file){
  return new Promise((resolve, reject)=>{
    if(!file.type.startsWith("video")){ resolve(true); return; }
    const video = document.createElement("video");
    video.preload = "metadata";
    video.onloadedmetadata = () => {
      URL.revokeObjectURL(video.src);
      if(video.duration > 30){
        reject(new Error("影片長度超過 30 秒，請重新拍攝或剪輯後再上傳"));
      }else{
        resolve(true);
      }
    };
    video.onerror = () => resolve(true); // 無法判斷長度時，先放行，不擋住使用者
    video.src = URL.createObjectURL(file);
  });
}

async function uploadAttachment(caseId, file, category){
  const ext = (file.name.split(".").pop() || "dat").toLowerCase();
  const path = `case-photos/${caseId}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
  const { error: upErr } = await sb.storage.from("attachments").upload(path, file);
  if(upErr) throw upErr;
  const { data: urlData } = sb.storage.from("attachments").getPublicUrl(path);
  const { error: insErr } = await sb.from("attachments").insert({
    related_type: "case",
    related_id: caseId,
    category,
    file_path: urlData.publicUrl,
    uploaded_by: state.profile?.id || null
  });
  if(insErr) throw insErr;
}

async function onAction(e){
  const el = e.currentTarget;
  const action = el.dataset.action;

  if(action === "go-home"){ state.view="home"; render(); }
  else if(action === "go-login"){ state.loginError=""; state.view="login"; render(); }
  else if(action === "go-signup"){ state.signupError=""; await loadStoresForSignup(); state.view="signup"; render(); }
  else if(action === "do-login"){ await doLogin(); }
  else if(action === "do-signup"){ await doSignup(); }
  else if(action === "do-logout"){ await doLogout(); }
  else if(action === "go-new-report"){
    resetNewReport();
    if(!state.storeId) await loadStoresForSignup();
    if(state.generalCategories.length === 0) await loadGeneralCategories();
    state.view="new-report"; render();
  }
  else if(action === "go-my-cases"){ await loadMyCases(); state.view="my-cases"; render(); }
  else if(action === "report-back"){ backReportStep(); }
  else if(action === "pick-type"){ state.newReport.repairType = el.dataset.type; state.newReport.step = 2; render(); }
  else if(action === "pick-general"){ state.newReport.generalCategory = el.dataset.value; render(); }
  else if(action === "pick-urgency"){ state.newReport.urgency = el.dataset.value; render(); }
  else if(action === "report-next"){ advanceReportStep(); }
  else if(action === "report-submit"){ await submitReport(); }
  else if(action === "open-case"){ await openCase(el.dataset.id); }
  else if(action === "confirm-result"){ await confirmCaseResult(el.dataset.value); }
  else if(action === "upload-slot"){
    fileTarget = { mode:"new-report", index: Number(el.dataset.index) };
    fileInput.multiple = false;
    fileInput.click();
  }
  else if(action === "upload-supplement"){
    fileTarget = { mode:"case-upload", index: Number(el.dataset.index), caseId: state.currentCase.id, category:"other", markKey:"supplement" };
    fileInput.multiple = false;
    fileInput.click();
  }
  else if(action === "upload-after"){
    fileTarget = { mode:"case-upload", index: Number(el.dataset.index), caseId: state.currentCase.id, category:"after_repair_photo", markKey:"after" };
    fileInput.multiple = false;
    fileInput.click();
  }
  else if(action === "go-setup-menu"){ state.view = "setup-menu"; render(); }
  else if(action === "go-setup-new-store"){
    await loadRegionsForSetup();
    state.setup.storeFormError = ""; state.setup.lastCreatedStoreId = "";
    state.view = "setup-new-store"; render();
  }
  else if(action === "go-setup-new-asset"){
    await loadAllStoresForSetup();
    await loadAssetMajorCategoriesForSetup();
    await loadAssetMinorCategoriesForSetup();
    state.view = "setup-new-asset"; render();
  }
  else if(action === "go-setup-new-infra"){
    await loadAllStoresForSetup();
    state.view = "setup-new-infra"; render();
  }
  else if(action === "capture-infra-location"){ await captureInfraLocation(); }
  else if(action === "go-setup-asset-photo"){
    await loadAllStoresForSetup();
    state.setup.photoStoreId = ""; state.setup.photoAssetResults = [];
    state.setup.photoSelectedAsset = null; state.setup.photoAssetAttachments = [];
    state.view = "setup-asset-photo"; render();
  }
  else if(action === "search-asset-for-photo"){ await searchAssetForPhoto(); }
  else if(action === "select-asset-for-photo"){
    state.setup.photoSelectedAsset = { id: el.dataset.id, asset_no: el.dataset.no, name: el.dataset.name };
    await loadSetupAssetAttachments(el.dataset.id);
  }
  else if(action === "upload-setup-asset-photo"){ triggerSetupAssetPhotoUpload(); }
  else if(action === "save-asset-name-mobile"){ await saveAssetNameMobile(); }
  else if(action === "delete-setup-asset-photo"){ await deleteSetupAssetPhoto(el.dataset.id); }
  else if(action === "submit-new-store"){ await submitNewStore(); }
  else if(action === "submit-new-asset"){ await submitNewAsset(); }
  else if(action === "suggest-asset-category-mobile"){ suggestAssetCategoryMobile(); }
  else if(action === "suggest-asset-no-mobile"){ await suggestAssetNoMobile(); }
  else if(action === "submit-new-infra"){ await submitNewInfra(); }
  else if(action === "upload-infra-photo"){
    fileTarget = { mode:"infra-photo" };
    fileInput.accept = "image/*";
    fileInput.multiple = true;
    fileInput.click();
  }
  else if(action === "remove-infra-photo"){
    const idx = parseInt(el.dataset.index, 10);
    state.setup.newInfra.photoFiles.splice(idx, 1);
    state.setup.newInfra.photoPreviews.splice(idx, 1);
    render();
  }
  else if(action === "export-session-assets"){ exportSessionAssets(); }
}

function resetNewReport(){
  state.newReport = { step:1, repairType:null, assetId:null, assetLabel:"", generalCategory:null,
                       selectedStoreId: null,
                       reportDate: new Date().toISOString().slice(0,10),
                       faultCategory:"", faultReason:"", suspectedCause:"", faultDescription:"",
                       reporterName:"", reporterPhone:"", urgency:null, photos:[] };
}

function backReportStep(){
  if(state.newReport.step > 1){ state.newReport.step -= 1; render(); }
  else { state.view = "home"; render(); }
}

function advanceReportStep(){
  const s = state.newReport;
  // 讀取目前畫面上的輸入值
  if(s.step === 3){
    s.reportDate = document.getElementById("report-date")?.value || s.reportDate;
    s.faultCategory = document.getElementById("fault-category")?.value || "";
    s.faultReason = document.getElementById("fault-reason")?.value || "";
    s.suspectedCause = document.getElementById("suspected-cause")?.value || "";
    s.faultDescription = document.getElementById("fault-desc")?.value || "";
    s.reporterName = document.getElementById("reporter-name")?.value || "";
    s.reporterPhone = document.getElementById("reporter-phone")?.value || "";
  }
  if(s.step === 1 && !s.repairType) return;
  if(s.step === 2){
    if(s.repairType === "asset" && !s.assetId) { alert("請先選擇資產"); return; }
    if(s.repairType === "general" && !s.generalCategory){ alert("請選擇報修類別"); return; }
  }
  if(s.step === 3){
    if(!s.faultCategory){ alert("請填寫報修設備"); return; }
    if(!s.reporterName){ alert("請填寫現場報修人"); return; }
    if(!s.urgency){ alert("請選擇緊急程度"); return; }
  }
  s.step += 1;
  render();
}

let assetSearchTimer = null;
function onAssetSearch(e){
  clearTimeout(assetSearchTimer);
  const q = e.target.value.trim();
  const effectiveStoreId = state.storeId || state.newReport.selectedStoreId;
  assetSearchTimer = setTimeout(async ()=>{
    const box = document.getElementById("asset-results");
    if(!q){ box.innerHTML = "輸入關鍵字開始搜尋…"; return; }
    const { data, error } = await sb.from("assets")
      .select("id, asset_no, name")
      .eq("store_id", effectiveStoreId)
      .or(`name.ilike.%${q}%,asset_no.ilike.%${q}%`)
      .limit(10);
    if(error){ box.innerHTML = "搜尋失敗：" + error.message; return; }
    if(!data || data.length===0){ box.innerHTML = "找不到符合的資產"; return; }
    box.innerHTML = data.map(a=>`
      <div class="card" style="padding:12px; cursor:pointer;" data-pick-asset="${a.id}" data-label="${a.asset_no} ${a.name}" data-name="${a.name}">
        <strong style="font-size:14px;">${a.name}</strong>
        <div style="font-family:monospace; font-size:12px; color:var(--ink-soft);">${a.asset_no}</div>
      </div>`).join("");
    box.querySelectorAll("[data-pick-asset]").forEach(el=>{
      el.addEventListener("click", ()=>{
        state.newReport.assetId = el.dataset.pickAsset;
        state.newReport.assetLabel = el.dataset.label;
        state.newReport.faultCategory = el.dataset.name;
        advanceReportStep();
      });
    });
  }, 300);
}

async function submitReport(){
  const s = state.newReport;
  const effectiveStoreId = state.storeId || s.selectedStoreId;

  if(!effectiveStoreId){
    alert("尚未選擇門市，無法送出報修。");
    return;
  }

  const payload = {
    store_id: effectiveStoreId,
    repair_type: s.repairType,
    asset_id: s.repairType === "asset" ? s.assetId : null,
    general_category: s.repairType === "general" ? s.generalCategory : null,
    report_date: s.reportDate,
    fault_category: s.faultCategory,
    fault_reason: s.faultReason,
    suspected_cause: s.suspectedCause,
    fault_description: s.faultDescription,
    reporter_name: s.reporterName,
    reporter_phone: s.reporterPhone,
    urgency: s.urgency,
    status: "new"
  };

  const { data, error } = await sb.from("cases").insert(payload).select().single();
  if(error){ alert("送出失敗：" + error.message); return; }

  const photosToUpload = s.photos.filter(Boolean);
  if(photosToUpload.length > 0){
    for(const file of photosToUpload){
      try{
        await uploadAttachment(data.id, file, "fault_photo_video");
      }catch(err){
        alert(`案件已建立（#${data.case_no}），但其中一個檔案上傳失敗：${err.message}`);
      }
    }
  }

  state.currentCase = data;
  state.view = "new-report-success";
  render();
}

async function loadMyCases(){
  let query = sb.from("cases").select("*, assets(name), stores(name)").order("created_at", { ascending:false });
  if(state.storeId){
    query = query.eq("store_id", state.storeId);
  }else{
    query = query.limit(50); // 非固定門市帳號（總務/管理者）先限制顯示最近 50 筆，避免列表過長

function suggestAssetCategoryMobile(){
  const nameInput = document.getElementById("su-asset-name");
  const name = (nameInput.value || "").trim();
  const hint = document.getElementById("su-asset-category-hint");
  if(!name){ alert("請先輸入資產名稱"); return; }

  let match = null;
  for(const [keywords, major, minor] of CATEGORY_KEYWORD_MAP){
    if(keywords.some(kw=> name.includes(kw))){ match = { major, minor }; break; }
  }
  if(!match){
    hint.textContent = "沒有比對到符合的關鍵字，請自己手動選擇大類與中類。";
    hint.style.color = "var(--warn, #C4622D)";
    return;
  }

  state.setup.newAsset.majorCode = match.major;
  const majorSel = document.getElementById("su-asset-major");
  if(majorSel) majorSel.value = match.major;

  const minorSel = document.getElementById("su-asset-minor");
  if(minorSel){
    const opts = state.setup.assetMinorCategories.filter(m=> m.major_code === match.major);
    minorSel.innerHTML = `<option value="">— 請選擇 —</option>` + opts.map(m=>`<option value="${m.code}">${m.code} ${m.name}</option>`).join("");
    minorSel.value = match.minor;
  }
  state.setup.newAsset.minorCode = match.minor;

  const majorCat = state.setup.assetMajorCategories.find(m=>m.code===match.major);
  const minorCat = state.setup.assetMinorCategories.find(m=> m.major_code===match.major && m.code===match.minor);
  hint.textContent = `建議分類：「${match.major} ${majorCat?majorCat.name:''}」→「${match.minor} ${minorCat?minorCat.name:''}」，僅供參考，請確認是否正確。`;
  hint.style.color = "var(--ok, #2F8F5B)";
}

async function suggestAssetNoMobile(){
  const major = document.getElementById("su-asset-major").value;
  const minor = document.getElementById("su-asset-minor").value;
  const storeId = document.getElementById("su-asset-store").value;
  const store = state.setup.allStores.find(s=>s.id===storeId);
  const hint = document.getElementById("su-asset-no-hint");

  if(!major || !minor || !store){
    alert("請先選好「所在門市」「大類」「中類」，再按建議編號");
    return;
  }
  const yy = String(new Date().getFullYear()).slice(2,4);
  const prefix = `${major}${store.code}-${yy}-${minor}-`;
  const { data, error } = await sb.from("assets").select("asset_no").ilike("asset_no", `${prefix}%`);
  if(error){ alert("查詢失敗：" + error.message); return; }
  let maxSeq = 0;
  (data||[]).forEach(row=>{
    const m = (row.asset_no||"").match(/-(\d{4})$/);
    if(m) maxSeq = Math.max(maxSeq, parseInt(m[1],10));
  });
  const nextSeq = String(maxSeq+1).padStart(4,'0');
  const suggested = `${prefix}${nextSeq}`;
  document.getElementById("su-asset-no").value = suggested;
  state.setup.newAsset.assetNo = suggested;
  hint.textContent = maxSeq
    ? `目前這個組合最大用到 ${prefix}${String(maxSeq).padStart(4,'0')}，已自動帶入建議編號，可以手動修改。`
    : `這個組合目前還沒有任何資產，已自動帶入第一號。`;
  hint.style.color = "var(--ok, #2F8F5B)";
}

async function captureInfraLocation(){
  if(!navigator.geolocation){
    alert("這個瀏覽器不支援定位功能");
    return;
  }
  try{
    const pos = await new Promise((resolve, reject)=>{
      navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy:true, timeout:10000 });
    });
    state.setup.newInfra.latitude = pos.coords.latitude;
    state.setup.newInfra.longitude = pos.coords.longitude;
  }catch(err){
    alert("無法取得定位，請確認已允許瀏覽器存取位置權限：" + err.message);
    return;
  }

  // 指南針方向：盡力嘗試，抓不到就跳過，不影響GPS定位結果
  try{
    if(typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function"){
      const perm = await DeviceOrientationEvent.requestPermission();
      if(perm !== "granted"){ render(); return; }
    }
    await new Promise((resolve)=>{
      let done = false;
      const handler = (e)=>{
        if(done) return;
        const heading = e.webkitCompassHeading != null ? e.webkitCompassHeading : (e.absolute && e.alpha != null ? (360 - e.alpha) : null);
        if(heading != null){
          state.setup.newInfra.compassHeading = heading;
          done = true;
          window.removeEventListener("deviceorientation", handler);
          resolve();
        }
      };
      window.addEventListener("deviceorientation", handler);
      setTimeout(()=>{
        if(!done){ window.removeEventListener("deviceorientation", handler); resolve(); }
      }, 1500);
    });
  }catch(e){ /* 指南針取得失敗，不影響流程 */ }

  render();
}

  let query = sb.from("assets").select("id, asset_no, name").eq("store_id", storeId).order("asset_no").limit(300);
  if(q) query = query.or(`name.ilike.%${q}%,asset_no.ilike.%${q}%`);
  const { data, error } = await query;
  if(error){ alert("載入失敗：" + error.message); return; }

  const assets = data || [];

    photoIds = new Set((photoRows||[]).map(p=>p.related_id));

  if(noPhotoOnly) results = results.filter(a=>!a.hasPhoto);

  state.setup.photoAssetResults = results;
  render();
}

function exportSessionAssets(){
  const su = state.setup;
  if(!su.sessionAssets.length){ alert("尚未新增任何資產，沒有可匯出的資料"); return; }
  if(!window.XLSX){ alert("匯出功能載入失敗，請檢查網路連線後重新整理頁面再試一次"); return; }

  // 依門市分組，每間門市各自一個工作表，方便工讀生對照原總表的門市分頁貼入
  const groups = {};
  su.sessionAssets.forEach(a=>{
    const key = a.store_name || "未指定門市";
    if(!groups[key]) groups[key] = [];
    groups[key].push(a);
  });

  const wb = XLSX.utils.book_new();
  Object.keys(groups).forEach(storeName=>{
    const rows = groups[storeName].map(a=>({
      "可直接貼入原總表A欄": `${a.asset_no}-${a.name}`,
      "資產編號": a.asset_no,
      "資產名稱": a.name,
      "品牌": a.brand || "",
      "型號": a.model || "",
      "來源": a.source === "new" ? "新購" : (a.source === "used" ? "二手" : "")
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, storeName.slice(0, 31));
  });

  const filename = `新增資產_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, filename);
}

async function init(){
  try{
    if(!sb){ render(); return; }

    const timeout = (ms) => new Promise((_, reject) =>
      setTimeout(() => reject(new Error(`連線逾時（超過 ${ms/1000} 秒沒有回應），請檢查網路，或確認 Supabase 專案的 URL / Key 是否正確。`)), ms)
    );

    const { data: { session } } = await Promise.race([
      sb.auth.getSession(),
      timeout(8000)
    ]);

    if(session){ await loadProfileAndEnter(); }
    else { state.view = "login"; render(); }
  }catch(err){
    app.innerHTML = `
      <main style="padding:40px 24px;">
        <div class="card">
          <h2>⚠️ 載入時發生錯誤</h2>
          <p style="color:var(--ink-soft); font-size:13px; line-height:1.7;">
            ${err.message || err}
          </p>
          <p style="color:var(--ink-soft); font-size:13px; line-height:1.7; margin-top:10px;">
            若你是用「直接雙擊開啟檔案（file://）」的方式打開這個頁面，
            部分瀏覽器（尤其 Safari）會封鎖與 Supabase 的連線。
            請改成上傳到 GitHub Pages 後用網址開啟。
          </p>
        </div>
      </main>`;
  }
}

init();
</script>
</body>
</html>
